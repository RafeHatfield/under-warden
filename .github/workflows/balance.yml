name: Balance Suite

on:
  pull_request:
  # Also run on main pushes so the baseline drift is visible
  push:
    branches: [main]

jobs:
  balance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        # The repo root has two solution files (UnderWarden.sln + the Godot editor's
        # UnderWarden.Presentation.sln), so a bare `dotnet restore` fails with MSB1011.
        run: dotnet restore UnderWarden.sln

      - name: Fast tests
        # Includes the M1.4 mid-run determinism soak as a PERMANENT gate: S1 (round-trip byte-identity —
        # scenario + dungeon + weighing matrices) and S2 (save/load divergence — per-turn state-hash
        # sequences across 9 feature-covered seeds). These carry no Category, so Category!=Slow runs them
        # here; the full soak adds < 1s, so it stays in the fast filter rather than a separate step.
        run: dotnet test tests/ --filter "Category!=Slow" --logger "console;verbosity=minimal"

      - name: Balance acceptance suite
        # Compares against committed baseline. Exit 1 if any FAIL verdict.
        # NO_BASELINE (first run on a fresh checkout) → exit 0 (PASS).
        run: >
          dotnet run --project tools/Harness --
          --suite
          --baseline reports/baselines/balance_suite_baseline.json
          --out-dir reports/balance_suite/ci_${{ github.sha }}

      - name: Upload balance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report-${{ github.sha }}
          path: reports/balance_suite/ci_${{ github.sha }}/
          if-no-files-found: warn
